name: safair

services:
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080}
    depends_on:
      gateway:
        condition: service_started

  gateway:
    build: ./services/gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: 8080
      PII_SERVICE_URL: http://pii-service:8001
      GUARDRAILS_SERVICE_URL: http://guardrails-service:8002
      MODERATION_SERVICE_URL: http://moderation-service:8003
      REDTEAM_SERVICE_URL: http://redteam-service:8004
      ORCHESTRATOR_SERVICE_URL: http://orchestrator:8005
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      pii-service:
        condition: service_healthy
      guardrails-service:
        condition: service_healthy
      moderation-service:
        condition: service_healthy
      redteam-service:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

  pii-service:
    build: ./services/pii-service
    ports:
      - "8001:8001"
    environment:
      PII_LANGUAGES: ${PII_LANGUAGES:-en,de}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  guardrails-service:
    build: ./services/guardrails-service
    ports:
      - "8002:8002"
    environment:
      GUARDRAILS_ENGINE: ${GUARDRAILS_ENGINE:-heuristic}
      LAKERA_GUARD_API_KEY: ${LAKERA_GUARD_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEMO_CONFIG_PATH: ${NEMO_CONFIG_PATH:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  moderation-service:
    build: ./services/moderation-service
    ports:
      - "8003:8003"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-}
      MODERATION_MODEL: ${MODERATION_MODEL:-llama-guard3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  orchestrator:
    build: ./services/orchestrator
    ports:
      - "8005:8005"
    environment:
      PII_SERVICE_URL: http://pii-service:8001
      GUARDRAILS_SERVICE_URL: http://guardrails-service:8002
      MODERATION_SERVICE_URL: http://moderation-service:8003
      OLLAMA_URL: ${OLLAMA_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATA_DIR: /data
    volumes:
      - safair-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redteam-service:
    build: ./services/redteam-service
    ports:
      - "8004:8004"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  safair-data:
